name = "ioths-contact"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

# Native per-IP rate limiter (no dashboard WAF rule needed).
# 5 submissions per 60s window, keyed by visitor IP in src/index.js.
# Note: the limiter always returns success under `wrangler dev` — it only
# enforces in production.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

# Secrets are NEVER stored here.
# Set them once via CLI:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put TURNSTILE_SECRET
#
# GITHUB_TOKEN  — fine-grained PAT, issues:write on rndrssn/ioths only
# TURNSTILE_SECRET — from dash.cloudflare.com > Turnstile > your site
